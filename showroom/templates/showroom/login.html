{% extends 'showroom/base.html' %}
{% load static %}

{% block title %}Sign In{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card shadow-lg">
                    <div class="auth-card-header">
                        <div class="auth-logo">
                            <i class="bi bi-car-front-fill"></i>
                        </div>
                        <h2 class="auth-title">Welcome Back</h2>
                        <p class="auth-subtitle">Sign in to your YourCars account</p>
                    </div>

                    <div class="auth-card-body">
                        <form method="post" novalidate>
                            {% csrf_token %}

                            <div class="form-group">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person-badge"></i> Username
                                </label>
                                <input type="text" name="username" class="form-control {% if form.errors %}is-invalid{% endif %}" placeholder="Enter your username" required autofocus>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Password
                                </label>
                                <input type="password" name="password" class="form-control {% if form.errors %}is-invalid{% endif %}" placeholder="Enter your password" required>
                            </div>

                            {% if form.errors %}
                            <div class="alert alert-danger py-2">
                                <i class="bi bi-exclamation-triangle"></i> Invalid username or password.
                            </div>
                            {% endif %}

                            <button type="submit" class="btn btn-auth w-100 mt-3">
                                <i class="bi bi-box-arrow-in-right"></i> Sign In
                            </button>
                        </form>

                        <div class="auth-divider">
                            <span>Don't have an account?</span>
                        </div>

                        <a href="{% url 'register' %}" class="btn btn-auth-outline w-100">
                            <i class="bi bi-person-plus"></i> Create New Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
