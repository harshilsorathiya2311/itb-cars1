{% extends 'showroom/base.html' %}
{% load static %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="auth-section" style="background: linear-gradient(135deg, #0f1117 0%, #1a1d27 50%, #2d3139 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card shadow-lg" style="border:none; border-radius:16px; overflow:hidden;">
                    <div class="auth-card-header admin-header">
                        <div class="auth-logo" style="background:rgba(255,255,255,0.1);">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="auth-title">Admin Panel</h2>
                        <p class="auth-subtitle">Sign in with your administrator credentials</p>
                    </div>

                    <div class="auth-card-body">
                        <form method="post" novalidate>
                            {% csrf_token %}

                            <div class="form-group">
                                <label class="form-label">
                                    <i class="bi bi-person-badge"></i> Username
                                </label>
                                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
                            </div>

                            <div class="form-group">
                                <label class="form-label">
                                    <i class="bi bi-lock"></i> Password
                                </label>
                                <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
                            </div>

                            {% if messages %}
                            <div class="alert alert-danger py-2" style="border-radius:8px;">
                                <i class="bi bi-exclamation-triangle"></i> Invalid admin credentials.
                            </div>
                            {% endif %}

                            <button type="submit" class="btn btn-auth w-100 mt-3">
                                <i class="bi bi-shield-lock-fill"></i> Admin Login
                            </button>
                        </form>

                        <div class="auth-divider">
                            <span>Not an admin?</span>
                        </div>

                        <a href="{% url 'login' %}" class="btn btn-auth-outline w-100">
                            <i class="bi bi-arrow-left"></i> User Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
